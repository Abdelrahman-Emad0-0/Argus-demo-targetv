# Runs the test suite on every push and pull request. Argus marks an autofix
# pull request ready for review only after this workflow is green (P4).
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8.3"
      - run: python -m pytest -q
